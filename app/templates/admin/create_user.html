{% extends "base.html" %}
{% block title %}Create User{% endblock %}
{% block content %}
<div class="page-header">
  <h2>Create User</h2>
  <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">← Back</a>
</div>
<div class="form-card">
  <form method="POST" action="{{ url_for('admin.create_user') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="off">
    </div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" name="role">
        <option value="supply_chain">Supply Chain User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password">Temporary Password <span class="hint">(min 8 characters — user must change on first login)</span></label>
      <input type="password" id="password" name="password" required minlength="8">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create User</button>
      <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
